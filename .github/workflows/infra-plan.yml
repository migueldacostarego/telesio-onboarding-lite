# Plan Terraform sur pull request, pour dev et prod. Identité en LECTURE SEULE (AZURE_CLIENT_ID_PLAN) :
# le code d'une PR s'exécute ici, il ne doit pas disposer des droits d'écriture.
# Identifiant fédéré attendu sur cette identité : sujet repo:<org>/<repo>:pull_request
name: Infra plan

on:
  pull_request:
    paths:
      - infra/**
      - .github/workflows/infra-plan.yml

permissions:
  contents: read
  id-token: write # OIDC

jobs:
  plan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: dev
            sub_var: AZURE_SUBSCRIPTION_ID_DEV
          - env: prod
            sub_var: AZURE_SUBSCRIPTION_ID_PROD
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID_PLAN }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars[matrix.sub_var] }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "0"
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend-config=envs/${{ matrix.env }}.backend.hcl
      - run: terraform validate
      # -lock=false : l'identité de plan n'a pas le droit d'écriture sur l'état.
      - run: terraform plan -lock=false -var-file=envs/${{ matrix.env }}.tfvars
