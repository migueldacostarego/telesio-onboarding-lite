# Sur main : build de l'app, puis dev (apply + déploiement), puis prod (apply + déploiement).
# Tout en OIDC, sans secret. L'approbation de prod se règle dans l'environnement GitHub « prod »
# (Required reviewers) : le job de prod ne démarre qu'après approbation.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - name: Paquet de déploiement (dist + dépendances de production)
        run: |
          npm prune --omit=dev
          zip -qr app.zip dist node_modules package.json package-lock.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-package
          path: app.zip
          retention-days: 7
          if-no-files-found: error

  dev:
    needs: build
    uses: ./.github/workflows/release-environment.yml
    with:
      environment: dev

  # Inactif tant que AZURE_SUBSCRIPTION_ID_PROD est vide. Sans cette condition, référencer l'environnement
  # « prod » le créerait sans aucune protection.
  prod:
    needs: dev
    if: ${{ vars.AZURE_SUBSCRIPTION_ID_PROD != '' }}
    uses: ./.github/workflows/release-environment.yml
    with:
      environment: prod
